version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: saji-db
    environment:
      POSTGRES_USER: saji
      POSTGRES_PASSWORD: saji_go_2026
      POSTGRES_DB: saji_go
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saji -d saji_go']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: saji-backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://saji:saji_go_2026@db:5432/saji_go
      JWT_SECRET: saji-go-dev-secret-cambiar-en-prod
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile.dev
    container_name: saji-mobile
    ports:
      - '5173:5173'
    volumes:
      - ./apps/mobile:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000/api
    command: npm run dev

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.dev
    container_name: saji-admin
    ports:
      - '5174:5173'
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000/api
    command: npm run dev

volumes:
  postgres_data: